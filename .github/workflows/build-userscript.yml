name: Build userscript
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.js'
      - '.github/workflows/build-userscript.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - name: Commit generated userscript
        run: |
          if git diff --quiet -- svg.user.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add svg.user.js
          git commit -m 'build: regenerate enhanced svg.user.js'
          git push
